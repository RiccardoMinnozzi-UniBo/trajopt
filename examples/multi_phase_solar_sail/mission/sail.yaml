# rerun make_problem.py after changing revolutions
revolutions: 21
initial_longitude_rad: "${np.pi}"
terminator_window_rad: 0.05
final_longitude_freedom_rad: "${np.pi}"

earth_mu_km3_s2: 398600.436233
earth_radius_km: 6378.1366
geo_radius_km:   42164.1696
day_s:           86400.0

area_to_mass_m2_kg:  10.0
solar_pressure_n_m2: 4.5391e-6
reflectivity:        1.0
max_steering_rate_rad_per_rad: 2.0

sun_direction_eci: [-1.0, 0.0, 0.0]
sun_angular_rate_deg_per_day: 0.9856
sun_angular_rate_rad_s: "${np.deg2rad(sun_angular_rate_deg_per_day) / day_s}"

perigee_altitude_km: 250.0
eccentricity_max:    0.003
final_perigee_radius_km: "${geo_radius_km + perigee_altitude_km}"

period_days:      "${2.0 * np.pi * np.sqrt(geo_radius_km**3 / earth_mu_km3_s2) / day_s}"
half_shadow_rad:  "${np.arcsin(earth_radius_km / geo_radius_km)}"
shadow_drift_rad: "${np.deg2rad(sun_angular_rate_deg_per_day) * period_days}"
final_longitude_rad: "${2.0 * np.pi * revolutions + shadow_drift_rad * revolutions - half_shadow_rad}"
max_elapsed_s: "${1.2 * (final_longitude_rad - initial_longitude_rad) / (2.0 * np.pi) * day_s}"
