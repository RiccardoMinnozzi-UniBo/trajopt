# x = [p - r_GEO, f, g, h, k, elapsed time], u = [steering angle], independent variable = true longitude

fcns:
  dynamics:                   solar_sail.py:dynamics
  shadow_boundary:            solar_sail.py:shadow_boundary
  phase_end_longitude:        solar_sail.py:phase_end_longitude
  terminal_eccentricity_cone: solar_sail.py:terminal_eccentricity_cone
  terminal_perigee_cone:      solar_sail.py:terminal_perigee_cone

params:
  inherit: sail.yaml

state:
  semi_latus_offset: {idx: [0], scale: 1000.0}
  f:                 {idx: [1], scale: 0.02}
  g:                 {idx: [2], scale: 0.02}
  h:                 {idx: [3], scale: 0.2}
  k:                 {idx: [4], scale: 0.2}
  elapsed_time:      {idx: [5], scale: "${params.max_elapsed_s}"}

control:
  steering_angle: {idx: [0], scale: 1.0}

time:
  scale: "${2.0 * np.pi * params.revolutions}"

constraints:
  dynamics:
    type: dynamics
    fcn: fcns.dynamics

  state_limits:
    type: state_limits
    lower: [0.0,    -0.01, -0.01, -0.1, -0.1, 0.0]
    upper: [1000.0,  0.01,  0.01,  0.1,  0.1, "${params.max_elapsed_s}"]

  steering_limits:
    type: control_limits
    lower: ["${-2.0 * np.pi * (params.revolutions + 2)}"]
    upper: ["${2.0 * np.pi * (params.revolutions + 2)}"]

  steering_rate_limit:
    type: control_rate_limit
    value: ["${params.max_steering_rate_rad_per_rad}"]

  arc_end_window:
    type: final_nonconvex_inequality
    fcn: fcns.phase_end_longitude
    scale: ["${2.0 * np.pi}"]
