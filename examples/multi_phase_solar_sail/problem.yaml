# Multi-phase solar-sail GEO disposal  --  Kelly & Bevilacqua (2021), Section 5.1
#
# A sail-equipped spacecraft starts on a circular geostationary orbit and must
# reach a near-circular graveyard orbit safely above the GEO belt, using solar
# radiation pressure alone.  Each revolution crosses the Earth shadow once,
# where the sail produces no thrust, so the trajectory is a chain of alternating
# sunlit and eclipse arcs solved as one multi-phase optimal control problem.
#
# Two simplifications relative to the reference: only Earth gravity is retained
# (no lunar/solar third-body perturbations), and the Sun line rotates uniformly
# in the equatorial plane (sun_angular_rate_deg_per_day) rather than following
# an ephemeris.  Neither changes the structure of the problem.
#
# This file is the PROBLEM: physics, terminal requirement, guess and the
# revolution search.  It carries no solver settings.  Each file in algorithms/
# inherits it and adds an algorithm -- a mesh (problem.sunlit_nodes, ...) and
# a method -- or chains several of them as a flow.  See algorithms/README.md.
#
# ---------------------------------------------------------------------------
# The knobs you are most likely to turn
# ---------------------------------------------------------------------------
#   problem.revolutions              structural guess -> phase count and guess
#   problem.revolution_search        outer loop that refines that guess
#   problem.sail.area_to_mass_m2_kg  the dominant performance parameter
#   problem.graveyard                the terminal orbit requirement
#   problem.state_bounds             must bracket the trajectory; sets scaling
#   problem.max_accumulated_defect_km      accuracy the answer must have
# ---------------------------------------------------------------------------

problem:
  # Structural guess for the number of revolutions.  It sets how many phases the
  # problem has and seeds the initial guess, but it is NOT a boundary condition:
  # interior arcs end on the shadow terminator wherever that happens to be, and
  # the final arc ends wherever the minimum-time solution wants it to.
  # This is only a STARTING GUESS.  main.py searches over the revolution count
  # and brackets the minimum from here, so a wrong value costs extra solves but
  # never the right answer.
  #
  # 21 is the verified minimum for the shipped sail, and both algorithms/ms.yaml
  # and algorithms/p.yaml reach it, with the graveyard met on the independently
  # propagated trajectory.  20 fails for both -- shooting converges but the
  # propagated orbit lands 5 km short with the eccentricity over cap,
  # collocation runs to the iteration cap ~4 km short -- so the feasible set
  # ends abruptly here rather than degrading.
  #
  # Getting both methods here took settings that differ between them: the
  # terminal margins and penalty.dynamics.W.init, both set per algorithm.
  # FINDINGS.md sections 8 and 10 document what was tried.
  #
  # Why not fewer: the phase chain ends at the last shadow entry, so dropping a
  # revolution removes a whole 2*pi of thrusting rather than a marginal amount.
  # The sail raises perigee by about 12 km per revolution near the end of the
  # transfer, and 20 revolutions falls 3.6-5 km short of the requirement.
  #
  # Setting it close to the expected answer just makes the search cheaper.
  revolutions: 21

  # How far the final arc may be stretched or shortened past its nominal end,
  # in radians.  About one revolution of slack gives the minimum-time cost a
  # real lever without letting the trajectory jump a whole phase.
  final_longitude_freedom_rad: "${np.pi}"

  # --- the shadow terminator -------------------------------------------------
  # The terminator is the edge of the Earth's shadow: the instant the spacecraft
  # crosses into or out of eclipse.  It is what physically defines where one
  # phase ends and the next begins -- on one side the sail is lit and produces
  # thrust, on the other it produces none.
  #
  # That crossing does not sit at a fixed longitude.  It is where the
  # spacecraft's perpendicular distance from the Earth-Sun line equals the
  # Earth's radius, i.e. r(L) |sin L| = R_Earth, so it depends on the orbit
  # radius at that moment and moves as the orbit is raised.
  #
  # `enforce_shadow_terminator` imposes exactly that, as the nonconvex equality
  # shadow_boundary = 0 at the end of every interior arc, so the solver places
  # each boundary where the crossing actually occurs.  This is the physically
  # representative formulation and the reason it is on: the alternative is to
  # pin each boundary to a constant worked out from the initial circular orbit,
  # which is only an approximation of the geometry.
  #
  # The window below is a *guard*, not the placement mechanism.  The terminator
  # equation has several roots per revolution (shadow entry, shadow exit, and
  # the two sunward points where the perpendicular distance is also R_Earth),
  # so the window keeps each boundary on the root it belongs to and stops an arc
  # collapsing or inverting.  The nominal eclipse arc is ~0.304 rad, so 0.05
  # leaves every arc >= 0.2 rad.
  #
  # Every algorithm inherits this same setting rather than restating it, so
  # no two can disagree about the physics.
  terminator_window_rad: 0.05
  enforce_shadow_terminator: true

  # The Sun sits along -sun_direction_eci, so the shadow is centred on
  # L = 0 (mod 2*pi).  Starting at L = pi puts the spacecraft in full sunlight
  # at the initial time, as in the reference.
  initial_longitude_rad: "${np.pi}"

  # Largest total dynamics defect the returned trajectory may carry, in km of
  # semi-latus rectum, accumulated over every interval of every phase.
  #
  # This is the setting that decides whether the answer is real.  trajopt bounds
  # the defect of each interval, and those errors add up along the trajectory;
  # the sail itself only raises the orbit by about 9 km per day, so a budget
  # that is large next to that lets the optimiser "reach" the graveyard orbit
  # by accumulating defect rather than by thrusting.  At the 1e-4 default --
  # 4.2 km per interval, because the semi-latus rectum is scaled by its own
  # magnitude -- a three-revolution transfer took 86 % of its orbit raise from
  # accumulated defect and still reported convergence.
  #
  # 10 km is comfortably below the physically achievable raise over any
  # transfer long enough to matter.  problem.defect_tolerance() turns it into
  # the per-interval eps, dividing by the interval count, so the budget stays
  # fixed as the revolution count and the node counts change.
  max_accumulated_defect_km: 3.0

  # Nodes per arc (problem.sunlit_nodes / eclipse_nodes), Radau segments per
  # arc (sunlit_hp_segments / eclipse_hp_segments) and the terminal margins
  # (graveyard.perigee_margin_km / eccentricity_margin) belong to the
  # discretisation, so they are set by each file in algorithms/ and not here.

  constants:
    earth_mu_km3_s2: 398600.436233
    earth_radius_km: 6378.1366
    geo_radius_km:   42164.1696
    day_s:           86400.0

  sail:
    area_to_mass_m2_kg:  10.0        # A/m of the sail-craft
    solar_pressure_n_m2: 4.5391e-6   # solar radiation pressure at 1 AU
    reflectivity:        1.0         # 1.0 = perfect specular reflector

  # Form of the minimum-time objective.  See _add_minimum_time_cost().
  #   longitude    - trajopt's min_time on the independent variable.  Cannot be
  #                  gamed, but is indifferent to an over-raised orbit.
  #   elapsed_time - cost on the elapsed-time state.  Penalises over-raising,
  #                  since a higher orbit has a longer period.
  #   both         - longitude, plus elapsed time at a small weight to break
  #                  ties within the flat set the longitude cost leaves behind.
  minimum_time_objective: elapsed_time
  elapsed_time_cost_weight: 0.1

  # Maximum sail slew rate, in steering radians per radian of orbital travel.
  # This is a real attitude-control limit, and it is also what keeps the problem
  # numerically tractable: without it the minimum-time optimum is bang-bang, the
  # primer flips by ~180 deg between adjacent nodes, and the dynamics defect
  # stalls around 1e-3 no matter how fine the mesh.  2.0 corresponds to roughly
  # one full revolution of the sail per half orbit.
  max_steering_rate_rad_per_rad: 2.0

  # Earth-to-Sun unit vector in ECI.  [-1, 0, 0] places the Sun in the
  # equatorial plane, which keeps the whole problem planar.
  sun_direction_eci: [-1.0, 0.0, 0.0]

  # Rate at which the Sun line sweeps about +Z, i.e. the Earth's orbital motion.
  # 360 deg / 365.25 d = 0.9856 deg/day.  Set to 0.0 for the fixed Sun.
  #
  # This is what makes the dynamics non-autonomous: the sail acceleration now
  # depends on the elapsed-time state, not only on where the spacecraft is.  It
  # matters because a sail can only be pushed away from the Sun, so with the Sun
  # fixed the thrust is confined to a half-space that is also fixed in inertial
  # space, and the eccentricity vector is pumped secularly.  Letting the Sun move
  # rotates that half-space, which is how the reference keeps eccentricity in
  # check over its 90-revolution transfer.
  sun_angular_rate_deg_per_day: 0.9856

  # Terminal graveyard orbit, per the IADC guidelines (Table B2 in the paper):
  # near-circular, safely above the geostationary belt.
  #
  # The eccentricity cap is the demanding half.  A sail is pushed only away from
  # the Sun, so thrust is available on roughly half of each orbit and the natural
  # tendency is for eccentricity to grow.  Meeting the cap requires the optimiser
  # to shape the eccentricity vector over the whole transfer rather than react
  # locally, which is exactly what a full trajectory optimisation can do and a
  # feedback law cannot.  If the terminal set cannot be met, the revolution
  # search will report it and try a different revolution count.
  graveyard:
    perigee_altitude_km: 250.0   # perigee radius must reach r_GEO + this
    eccentricity_max:    0.003

    # graveyard.perigee_margin_km and graveyard.eccentricity_margin are set per
    # algorithm; see algorithms/ms.yaml for what they are and why.

  # Outer loop over the revolution count (the paper's Algorithm 1).  main.py
  # runs this on every invocation, starting from the guess above and bracketing
  # the minimum from there: stepping down if the guess is feasible, up if it is
  # not.  That is what makes the example self-driving -- change the sail or the
  # discretisation and it still finds the minimum-time solution.
  #
  # Each step is a full SCP solve, so a good guess is worth having; it just is
  # not required.  `minimum` and `maximum` bound the scan and `max_solves` caps
  # the total work.
  revolution_search:
    enabled: true      # set false to solve once at the guess instead
    minimum: 1
    maximum: 30
    max_solves: 12

  # Allowed state intervals (paper Eq. 44).  These also set the scaling, but see
  # _state_scales() in problem.py: trajopt divides by a scale with no offset, so
  # the interval amplitude is the right scale only for a state centred on zero
  # (f, g, h, k, elapsed time).  The semi-latus rectum is not, so it is scaled by
  # its magnitude instead -- dividing p ~ 42164 km by a 700 km amplitude would
  # leave p_nd ~ 60 and the dynamics defect stalls two orders of magnitude above
  # tolerance.
  #
  # The bounds must BRACKET the whole trajectory, not just its endpoints.  The
  # sail pumps eccentricity on the way out and the optimiser then brings it back
  # under the graveyard cap, so the peak in f and g is well above the terminal
  # value; clipping it shows up as a dynamics defect, not as a visibly active
  # bound.  The validation report prints the peaks, so size these from a run.
  #
  # The orbital-element bounds are fixed by the terminal orbit, which does not
  # depend on the sail, so these same numbers serve any area-to-mass ratio.  The
  # elapsed-time bound is the exception and is derived from the revolution count
  # rather than written out, which is what keeps the revolution count the only
  # thing that changes between sail sizings.
  state_bounds:
    semi_latus_offset_km:    [0.0, 1000.0]     # relative to r_GEO (paper Eq. 44)
    eccentricity_component:  [-0.01, 0.01]     # f and g (paper Eq. 44)
    inclination_component:   [-0.1, 0.1]       # h and k (stay at 0: planar)
    days_per_revolution_bound: 1.2             # a revolution takes ~1.0 day;
                                               # this bounds the elapsed time

  # Initial guess.  The steering angle is ramped between these two values and
  # the state comes from propagating the true dynamics through the arcs in
  # turn, so the guess is an actual trajectory rather than a straight line.
  #
  # The paper's Eq. 53 start primer is radial, i.e. theta = 0.  Do not use that
  # here: the trajectory starts at L = pi with the Sun at -X, so the radial
  # direction points straight into the Sun, the steering law feathers the sail
  # (alpha = 90 deg, no thrust) and the guess begins on the one point where the
  # law is not differentiable.  Starting transverse, Eq. 54's end primer, avoids
  # it and gives the sail authority from the first node.
  guess:
    steering_angle_start_rad: "${0.5 * np.pi}"
    steering_angle_stop_rad: "${0.5 * np.pi}"

output:
  # directory defaults to results/<algorithm file name>
  solution_file: solution.npz
  animation_file: trajectory_3d.gif
  animation_frames: 72
