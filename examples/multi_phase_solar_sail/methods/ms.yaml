trajectory:
  inherit: ../mission/problem.yaml

method:
  inherit:
    - trajopt/methods/stable/configs/first_order/autoscvx.yaml
    - trajopt/methods/common/configs/initial_guess/straight_line.yaml

  hyperparams:
    discretize:
      nsub: 6

    convergence:
      flag_conv: 2
      eps_cost: 1.0e-5
      iter_max: 300

    trust_region:
      tr_step:
        z: 10.0
        nu: 2.0

    penalties:
      final_nonconvex_equality:   {vb: standard}
      final_nonconvex_inequality: {vb: none}
