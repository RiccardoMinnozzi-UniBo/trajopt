# Pseudospectral variant of config.yaml.
#
# Identical problem -- same dynamics, bounds, scaling, guess and terminal
# conditions -- discretised with flipped Legendre-Radau collocation instead of
# RK4 multiple shooting.  Everything is inherited, so the two configurations
# cannot drift apart: only what genuinely belongs to the discretisation is
# overridden here.
#
#     python main.py config-ps.yaml
#
# Note on the mesh relation
# -------------------------
# trajopt's pseudospectral mesh used to pin each segment's initial epoch, which
# combined with time continuity froze every interior phase boundary at its
# initial-guess longitude and left the shadow-terminator equality violated by
# 1.3e-02.  That is fixed in the package (see README, "Changes to trajopt
# itself", item 2); the residual is now 1.1e-08, two orders of magnitude better
# than multiple shooting manages.
#
# Notes on the two methods
# ------------------------
# * `nsub` (RK4 substeps per shooting interval) has no meaning here: Radau
#   collocation enforces the dynamics at the collocation nodes through the
#   differentiation matrix rather than by integrating between them.
# * `equal_dt` must be off.  Radau nodes are deliberately not equally spaced.
# * `hp_segments` splits each arc into that many Radau sub-intervals.  It must
#   divide (num_nodes - 1) for *every* segment, sunlit and eclipse alike, since
#   it is a method-wide flag; 1 means one global polynomial per arc and so
#   places no constraint on the node counts.  That is what lets this file reuse
#   the node counts from config.yaml unchanged, which is what makes the two
#   methods comparable.

inherit: config.yaml

# Deliberately no `problem:` block.  The entire problem definition -- the
# shadow-terminator treatment included -- is inherited verbatim, so the two
# configurations cannot disagree about the physics: there is exactly one place
# where it is written down.  Only the discretisation and the output directory
# differ below.

problem:
  # Collocation needs more points per arc than shooting does.  The Radau
  # residual at 12 nodes is already tiny (1.1e-06) while the re-propagated
  # trajectory accumulates 6.4 km of defect, because the polynomial satisfies
  # the dynamics *at* the nodes and the interpolation error between them is
  # what a propagator sees.  Judge the mesh by `max_propagation_error_nd`, not
  # by the collocation residual.
  #
  # A mesh study over 12/3, 16/3, 20/4 and 24/4 gave re-propagation errors of
  # 2.61e-03, 7.98e-04, 7.66e-04 and 4.61e-04.  Only 24/4 comes under the 1e-03
  # limit and reaches the graveyard, and it is also the fastest of the fine
  # meshes.  Refining collocation costs nothing here.
  sunlit_nodes: 24
  eclipse_nodes: 4

  # No terminal margin is needed here, and adding one is counter-productive.
  #
  # The margin in config.yaml compensates the gap between the nodal terminal
  # state and the independently propagated one, and that gap belongs to the
  # discretisation: shooting at 12 nodes per arc lands 75 m low without it,
  # collocation at 24 nodes does not.  Asking this mesh for the extra 300 m buys
  # nothing (+250.41 km instead of +250.11) and costs accuracy -- the
  # per-interval defect goes 4.82e-06 -> 6.91e-06 and crosses the 5.04e-06
  # tolerance, so the solve stops validating.  It is listed with the node counts
  # because it is the same kind of setting.
  graveyard:
    perigee_margin_km: 0.0

method:
  flags:
    discretize: ps
    equal_dt: 0
    hp_segments: 1

  penalty:
    # THE setting that decides whether collocation can solve this problem.
    #
    # config.yaml starts the dynamics penalty at 100 because trajopt's min_time
    # cost sums the longitude over every node of the final segment, so its
    # magnitude grows with the node count and can outweigh the dynamics penalty.
    # That reasoning is right for shooting and wrong here, because this mesh has
    # roughly twice as many nodes: the same weight sits very differently against
    # the objective, and starting that high over-constrains the iteration.
    #
    # The cost is two revolutions.  At 100 collocation cannot solve 22
    # revolutions at all -- it runs to the iteration cap 4 km short, and no mesh,
    # hp_segments value, solver or initial guess rescues it.  At the trajopt
    # default of 1.0 it solves 21 revolutions in 15 iterations, the fastest
    # solve in the example.  Shooting wants the opposite: at 1.0 it fails at 20
    # revolutions where at 100 it converges.
    dynamics:
      W:
        init: 1.0

output:
  directory: results-ps
